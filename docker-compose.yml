services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/trendz
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: http://localhost:5173
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    ports:
      - "5001:5000"
    volumes:
      - product-uploads:/app/uploads

  client:
    build: ./client
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo-data:
  product-uploads:
