apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendz-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trendz-client
  template:
    metadata:
      labels:
        app: trendz-client
    spec:
      containers:
        - name: client
          image: 064032700005.dkr.ecr.eu-north-1.amazonaws.com/trendz-client:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
