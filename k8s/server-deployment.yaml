apiVersion: apps/v1
kind: Deployment
metadata:
  name: trendz-server
  labels:
    app: trendz-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trendz-server
  template:
    metadata:
      labels:
        app: trendz-server
    spec:
      containers:
        - name: server
          image: 064032700005.dkr.ecr.eu-north-1.amazonaws.com/trendz-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"

            - name: MONGODB_URI
              value: "mongodb://mongo:27017/trendz"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trendz-server-secret
                  key: JWT_SECRET

            - name: CLIENT_ORIGIN
              value: "http://localhost:5173"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
